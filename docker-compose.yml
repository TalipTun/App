services:
  backend:
    build: .
    ports: 
      - "8000:8000"
    volumes:
      - ./app:/code/app
    secrets:
      - github_token
      - postgres_password
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gitpulse_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: gitpulse_db
    ports:
      - "5432:5432"
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:

secrets:
  github_token:
    file: ./secrets/github_token.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
